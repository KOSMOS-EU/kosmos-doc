site_name: KOSMOS — Gesamtdokumentation
site_description: >-
  Dokumentation der KOSMOS Edition (Open Core): der zentrale,
  revisionssichere und geschützte Datenort, der digitale Prozesse
  vertikal und horizontal skaliert.
site_url: https://kosmos.technology/
repo_url: https://github.com/KOSMOS-EU/kosmos-doc
repo_name: KOSMOS-EU/kosmos-doc
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: de
  custom_dir: overrides
  logo: assets/kosmos-logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Startseite: index.md
  - Universum:
      - universum/index.md
      - Revisionssicherheit: universum/revisionssicherheit.md
      - Schutz: universum/schutz.md
      - Skalierung: universum/skalierung.md
  - Architektur:
      - architektur/index.md
      - Netzwerk: architektur/netzwerk.md
      - Deployment: architektur/deployment.md
      - Updates: architektur/updates.md
  - Dienste:
      - dienste/index.md
      - Open Core: dienste/opencore.md
      - Suche: dienste/suche.md
      - open_taki: dienste/open_taki.md
      - microllm: dienste/microllm.md
      - AI-Stack: dienste/ai-stack.md
      - Collaboration: dienste/collabora.md
      - Classes: dienste/classes.md
      - Intranet: dienste/intranet.md
      - Kalender: dienste/kalender.md
      - SearXNG: dienste/searxng.md
      - Scanner: dienste/scanner.md
      - Worker: dienste/worker.md
      - Optionale Dienste: dienste/optional.md
  - Betrieb:
      - Monitoring: betrieb/monitoring.md
      - Backup: betrieb/backup.md
      - Troubleshooting: betrieb/troubleshooting.md
  - FAQ: faq/index.md
  - Kontakt:
      - Impressum: kontakt/impressum.md
