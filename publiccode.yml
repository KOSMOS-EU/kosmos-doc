description:
  de:
    genericName: "KOSMOS-Dokumentation"
    shortDescription: "Gesamtdokumentation der KOSMOS Edition (Open Core) — des zentralen, revisionssicheren und geschützten Datenorts, der digitale Prozesse vertikal und horizontal skaliert."
    detailedDescription: |
      Diese Dokumentation beschreibt die KOSMOS Edition (Open Core)
      als Ganzes: das KOSMOS-Universum (Revisionssicherheit, Schutz,
      Skalierung), die Architektur (Pod, Netzwerk, Deployment,
      Updates), alle Dienste der Edition (Open Core, Suche, open_taki,
      microllm, AI-Stack, Collaboration, Classes, Intranet, Kalender,
      SearXNG, Scanner, Worker, optionale Dienste) sowie den Betrieb
      (Monitoring, Backup, Troubleshooting).

      Die Edition wird von der Innovationskommune Stadt Brandis im
      Rahmen des Parthlandverbunds (acht Kommunen des Landkreises
      Leipzig) als praxisgeführtes Vortriebsprojekt vorangetrieben:
      Die Anforderungen entstehen im laufenden Verwaltungsbetrieb,
      nicht in einer Anforderungsanalyse.

